name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  quality:
    name: Type-check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Fastify API (apps/writersarcade-api) is an npm package outside the
      # pnpm workspace; its tests run under the root vitest, so install its
      # deps so fastify etc. resolve from apps/writersarcade-api/node_modules.
      - name: Install API dependencies
        run: npm ci --prefix apps/writersarcade-api --no-audit --no-fund

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/writersarcade' }}

      - name: TypeScript check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm vitest run

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: 'ci'
          NEXT_PUBLIC_GAME_NFT_MAINNET: '0x0000000000000000000000000000000000000000'
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/writersarcade' }}
