name: Daily Challenge Shuffle

# Backup scheduler — primary is the VPS systemd timer
# (scripts/cron/install-daily-challenge-cron.sh → 00:05 UTC).
# Add repository secret: CRON_SECRET (same value as Vercel Production / VPS env).

on:
  schedule:
    # 00:15 UTC — after VPS timer (00:05 UTC)
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Daily Challenge setup (shuffle + featured auto-pick)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.WRITERSARCADE_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured — skipping."
            exit 1
          fi

          APP_URL="${APP_URL:-https://writersarcade.vercel.app}"

          http_code=$(curl -sS -o /tmp/shuffle-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${APP_URL}/api/daily-challenge/setup")

          cat /tmp/shuffle-response.json
          echo
          echo "HTTP ${http_code}"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
