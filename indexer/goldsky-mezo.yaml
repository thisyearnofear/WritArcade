name: writersarcade-mezo
apiVersion: 3
sources:
  my_raw_logs:
    type: dataset
    dataset_name: mezo-testnet.raw_logs
    version: 1.0.0
transforms:
  decoded_events:
    primary_key: transaction_hash
    sql: >
      SELECT 
        _gs_log_decode(
          '[{"type":"event","name":"GameMintedAndPaid","inputs":[{"name":"creator","type":"address","indexed":true,"internalType":"address"},{"name":"tokenURI","type":"string","indexed":false,"internalType":"string"},{"name":"metadata","type":"tuple","indexed":false,"internalType":"struct MezoPaymentSplitter.GameMetadata","components":[{"name":"articleUrl","type":"string","internalType":"string"},{"name":"creator","type":"address","internalType":"address"},{"name":"writerCoin","type":"address","internalType":"address"},{"name":"genre","type":"string","internalType":"string"},{"name":"difficulty","type":"string","internalType":"string"},{"name":"createdAt","type":"uint256","internalType":"uint256"},{"name":"gameTitle","type":"string","internalType":"string"}]},{"name":"creatorFee","type":"uint256","indexed":false,"internalType":"uint256"},{"name":"platformFee","type":"uint256","indexed":false,"internalType":"uint256"}],"anonymous":false}]', 
          topics, 
          data
        ) AS decoded,
        block_number, 
        transaction_hash 
      FROM my_raw_logs
      WHERE address = '0x32d0356f533cc429f94db73f383bbb21a459e16b'
sinks:
  webhook_sink:
    type: webhook
    from: decoded_events
    url: "https://api.snel.famile.xyz/writersarcade/api/indexer/webhook"
    headers:
      x-api-key: "YOUR_WEBHOOK_SECRET"
