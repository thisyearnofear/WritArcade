name: writersarcade-mezo
apiVersion: 3
sources:
  my_raw_logs:
    type: dataset
    dataset_name: mezo-testnet.raw_logs
    version: 1.0.0
transforms:
  decoded_events:
    primary_key: transaction_hash
    sql: >
      SELECT 
        _gs_log_decode(
          '[{"type":"event","name":"GameMintedAndPaid","inputs":[{"name":"creator","type":"address","indexed":true,"internalType":"address"},{"name":"tokenURI","type":"string","indexed":false,"internalType":"string"},{"name":"metadata","type":"tuple","indexed":false,"internalType":"struct MezoBoostedSplitter.GameMetadata","components":[{"name":"articleUrl","type":"string","internalType":"string"},{"name":"creator","type":"address","internalType":"address"},{"name":"writerCoin","type":"address","internalType":"address"},{"name":"genre","type":"string","internalType":"string"},{"name":"difficulty","type":"string","internalType":"string"},{"name":"createdAt","type":"uint256","internalType":"uint256"},{"name":"gameTitle","type":"string","internalType":"string"}]},{"name":"creatorFee","type":"uint256","indexed":false,"internalType":"uint256"},{"name":"platformFee","type":"uint256","indexed":false,"internalType":"uint256"},{"name":"boosted","type":"bool","indexed":false,"internalType":"bool"}],"anonymous":false}]', 
          topics, 
          data
        ) AS decoded,
        block_number, 
        transaction_hash 
      FROM my_raw_logs
      WHERE address = '0x56ee5a3f122da00b635ddbb319708e24450aeb89'
sinks:
  analytics_dataset:
    type: dataset
    from: decoded_events
